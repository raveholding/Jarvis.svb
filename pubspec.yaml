name: jarvis_svb
description: "Jarvis SVB — Agente de IA proactivo y contextual para Android. Desarrollado por Vincular Business."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado reactivo
  flutter_riverpod: ^2.6.1

  # Audio + Edge AI (todo local)
  record: ^6.0.0
  whisper_ggml: ^2.9.0

  # Voz y notificaciones
  flutter_tts: ^4.2.0
  flutter_local_notifications: ^18.0.1
  flutter_foreground_task: ^9.2.0

  # Contexto (GPS, movimiento, agenda)
  geolocator: ^14.0.0
  sensors_plus: ^6.1.1
  device_calendar: ^4.3.3
  permission_handler: ^12.0.0

  # Persistencia cifrada + nube
  sqflite_sqlcipher: ^3.1.0
  flutter_secure_storage: ^9.2.4
  supabase_flutter: ^2.9.0

  # Utilidades
  http: ^1.4.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ">=0.19.0 <0.21.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
