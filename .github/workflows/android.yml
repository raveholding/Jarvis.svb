name: Compilar APK Android

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'supabase/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar logs
        run: mkdir -p logs && flutter --version | tee logs/flutter_version.txt

      - name: Generar plataforma Android (si falta)
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --no-pub --platforms=android --org com.vincularbusiness --project-name jarvis_svb . 2>&1 | tee logs/create.txt
            rm -f test/widget_test.dart
            echo "SCAFFOLDED=1" >> "$GITHUB_ENV"
          fi
          dart run tool/setup_android.dart 2>&1 | tee logs/setup_android.txt

      - name: Dependencias
        run: flutter pub get 2>&1 | tee logs/pub_get.txt

      - name: Análisis estático
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee logs/analyze.txt

      - name: Tests
        continue-on-error: true
        run: flutter test 2>&1 | tee logs/test.txt

      - name: Compilar APK (release, arm64)
        run: flutter build apk --release --target-platform android-arm64 2>&1 | tee logs/build.txt

      - name: Guardar plataforma Android en el repo
        if: env.SCAFFOLDED == '1'
        run: |
          git config user.name "jarvis-ci"
          git config user.email "ci@vincularbusiness.local"
          git add android
          git commit -m "chore(android): plataforma generada y configurada por CI" || true
          git push || true

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Jarvis SVB v0.1.${{ github.run_number }}
          body: |
            APK de prueba para Android 8+ (arm64).
            Instalación: descargá `app-release.apk` desde el celular y abrilo (permití "instalar apps desconocidas").
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true

      - name: Publicar logs de CI (rama ci-logs)
        if: always()
        run: |
          echo "${{ job.status }} ${{ github.sha }}" > logs/status.txt
          mkdir -p /tmp/ci && cp -r logs/. /tmp/ci/
          cd /tmp/ci
          git init -q && git checkout -q -b ci-logs
          git add -A
          git -c user.name=jarvis-ci -c user.email=ci@local commit -qm "logs ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
